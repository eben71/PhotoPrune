packages:
  - apps/*
  - packages/*
  - docs

overrides:
  '@babel/core': 7.29.7
  'brace-expansion@^1.1.0': 1.1.18
  'brace-expansion@^5.0.0': 5.0.9
  esbuild: 0.28.1
  form-data: 4.0.6
  js-yaml: 4.3.1
  next: 16.2.11
  postcss: 8.5.23
  rollup: 4.59.0
  sharp: 0.35.0
  vite: 7.3.5
  ws: 8.21.0

onlyBuiltDependencies:
  - esbuild
  - lefthook
  - sharp
  - unrs-resolver

allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
  unrs-resolver: true

# Keep pnpm's supply-chain delay explicit. The dependency preflight checks
# lockfile publish times before the expensive CI gate and tells maintainers
# when a too-new package can be refreshed safely.
minimumReleaseAge: 1440

# Temporary exception for the already-pinned Turborepo 2.10.2 toolchain
# entries committed before PP-021 enabled the early preflight. Remove this
# block after the branch has been refreshed outside the release-age window.
minimumReleaseAgeExclude:
  - turbo
  - '@turbo/darwin-64'
  - '@turbo/darwin-arm64'
  - '@turbo/linux-64'
  - '@turbo/linux-arm64'
  - '@turbo/windows-64'
  - '@turbo/windows-arm64'
